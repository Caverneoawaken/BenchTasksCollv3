name: Assemble finalpool
on:
  push:
    branches: [finalpool]
    paths:
      - .github/workflows/finalpool-assemble.yml
      - .github/finalpool-assemble.py
      - .github/finalpool-selection.json
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: finalpool
      - name: Audit requirements and copy exact Git trees
        run: python3 .github/finalpool-assemble.py
